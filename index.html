
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <section class="calculator">

            <header class="header">
                <div>
                    <h1>Scientific Calculator</h1>
                    <p>ByTia</p>
                </div>
                <button id="history-toggle" class="history-btn">History</button>
            </header>

            <div class="display">
                <div id="previous-operand">Ready to calculate</div>
                <div id="current-operand">0</div>
            </div>

            <div class="mode-row">
                <button id="angle-mode" class="mode active">DEG</button>
            </div>

            <div class="buttons">

                <button class="function" data-value="sin(">sin</button>
                <button class="function" data-value="cos(">cos</button>
                <button class="function" data-value="tan(">tan</button>
                <button class="function" data-value="log(">log</button>
                <button class="function" data-value="ln(">ln</button>

                <button class="function" data-value="sqrt(">√</button>
                <button class="function" data-value="^2">x²</button>
                <button class="function" data-value="^3">x³</button>
                <button class="function" data-value="^">xʸ</button>
                <button class="function" data-value="!">x!</button>

                <button class="function" data-value="(">(</button>
                <button class="function" data-value=")">)</button>
                <button class="function" data-value="pi">π</button>
                <button class="function" data-value="e">e</button>
                <button class="function" data-value="%">%</button>

                <button class="special" data-action="clear">AC</button>
                <button class="special" data-action="delete">⌫</button>
                <button class="operator" data-value="/">÷</button>
                <button class="operator" data-value="*">×</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="+">+</button>
                <button class="operator" data-value="ans">Ans</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button data-value=".">.</button>
                <button class="operator" data-value="+/-">±</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="zero" data-value="0">0</button>
                <button class="equal" data-action="calculate">=</button>

            </div>

            <div id="history-panel" class="history-panel hidden">
                <div class="history-header">
                    <h3>Calculation History</h3>
                    <button id="clear-history">Clear</button>
                </div>
                <div id="history-list">No history yet</div>
            </div>

            <footer>
                Software Testing & Quality Assurance
            </footer>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
